name: Build and publish PDFs

# Builds the resume and CV on every push to main (including pushes from
# Overleaf) and publishes them with GitHub Pages. Because the user site
# (cjstahoviak.github.io) has a custom domain, this repo's Pages site is
# served under it, so the latest PDFs are always at:
#   https://calvinstahoviak.com/Calvin-Stahoviak-Resume-CV/Calvin_Stahoviak_Resume.pdf
#   https://calvinstahoviak.com/Calvin-Stahoviak-Resume-CV/Calvin_Stahoviak_CV.pdf
# The website links there, plus short links at /resume and /cv. If a build
# fails, nothing is published and the previous PDFs stay live.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned so the TeX Live version only changes when this line does.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install TeX Live
        # cm-super supplies the same Type 1 fonts Overleaf uses.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            cm-super poppler-utils

      - name: Build resume and CV
        run: |
          for doc in resume cv; do
            # Two passes so the \pubcite numbers resolve.
            for pass in 1 2; do
              pdflatex -interaction=nonstopmode -halt-on-error \
                -file-line-error "$doc.tex" > "$doc-pass$pass.txt" || {
                tail -n 40 "$doc-pass$pass.txt"
                echo "::error file=$doc.tex::LaTeX failed on pass $pass"
                exit 1
              }
            done
            # A missing \pubitem key would print as [??] in the PDF.
            if grep -q "Reference .* undefined" "$doc.log"; then
              grep "Reference .* undefined" "$doc.log"
              echo "::error file=$doc.tex::Undefined reference; check \pubcite keys"
              exit 1
            fi
          done
          pages=$(pdfinfo resume.pdf | awk '/^Pages:/ {print $2}')
          echo "Resume: $pages page(s); CV: $(pdfinfo cv.pdf | awk '/^Pages:/ {print $2}') page(s)"
          if [ "$pages" -ne 1 ]; then
            echo "::warning file=resume.tex::The resume is $pages pages, not 1"
          fi

      - name: Assemble site
        run: |
          mkdir -p _site
          cp resume.pdf _site/Calvin_Stahoviak_Resume.pdf
          cp cv.pdf _site/Calvin_Stahoviak_CV.pdf
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="color-scheme" content="light dark">
            <meta name="robots" content="noindex">
            <title>Calvin Stahoviak: Resume and CV</title>
          </head>
          <body style="font-family: sans-serif; margin: 3rem auto; max-width: 32rem; padding: 0 1rem">
            <h1>Calvin Stahoviak</h1>
            <ul>
              <li><a href="Calvin_Stahoviak_Resume.pdf">Resume (PDF)</a></li>
              <li><a href="Calvin_Stahoviak_CV.pdf">CV (PDF)</a></li>
            </ul>
            <p><a href="/">calvinstahoviak.com</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
